<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Υπαγωγή - Lex AI</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpg" href="/static/images/lexlogo.jpg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome για εικονίδια -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light text-dark min-vh-100 d-flex flex-column">

    <!-- Header / Logo Section -->
    <header class="container text-center py-4 position-relative">
        <div class="d-flex flex-column align-items-center justify-content-center position-relative">
            <!-- Κουμπί επιστροφής / Logo πάνω αριστερά -->
            <a href="/" class="position-absolute start-0 top-0 text-primary text-decoration-none d-flex align-items-center gap-2 mt-2">
                <i class="fa-solid fa-arrow-left"></i> <span class="d-none d-sm-inline">Αρχική</span>
            </a>
            <img src="/static/images/lexlogo.jpg" alt="LEX AI Logo" width="75" class="rounded-circle shadow-sm border border-primary mb-3" style="border-width: 2px !important;">
            <h1 class="h2 m-0 text-dark fw-bold">Εξώδικο - Lex AI</h1>
            <div class="mt-2 header-divider"></div>
        </div>
    </header>

    <!-- Main Content / Form Section -->
    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="p-4 p-md-5 rounded-4 bg-white shadow-sm border">
                    
                    <div class="text-center mb-4">
                        <h2 class="h5 text-dark fw-bold">Δημιουργία Φακέλου Υπαγωγής</h2>
                        <p class="text-muted small">Συμπληρώστε τα στοιχεία της υπόθεσης για την αυτόματη σύνταξη του εγγράφου.</p>
                    </div>

                    <form method="POST" action="/ypagogi">
                        <!-- Περιγραφή Υπόθεσης -->
                        <div class="mb-4">
                            <h5 class="text-primary fs-6 mb-3 border-bottom pb-2">
                                <i class="fa-solid fa-calendar-check me-2"></i> Περιγραφή Υπόθεσης / Ιστορικό
                            </h5>
                            <div class="row g-3">                        
                                <div class="col-md-12">
                                    <textarea name="case_description" class="form-control bg-light text-dark border" rows="4" placeholder="Σχόλια... (Προσθήκη ειδικών περιστάσεων, π.χ. φθορές στο ακίνητο ή μη απάντηση σε μηνύματα)"></textarea>
                                </div>
                            </div>
                        </div>             
                        <!-- Κουμπιά Υποβολής / Εκκαθάρισης -->
                        <div class="d-flex justify-content-end gap-2">
                            <input type="reset" value="Εκκαθάριση" class="btn btn-outline-secondary px-4">
                            <input type="submit" value="Υποβολή" class="btn btn-primary fw-bold px-4 text-white">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-3 border-top text-muted small mt-auto">
        <div class="container">
            <p class="m-0 mb-1"><strong>Lex AI Governance Suite</strong></p>
            <p class="m-0">&copy; 2026 Lex AI. Με επιφύλαξη παντός δικαιώματος.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Validation JS -->
    <script src="/static/js/form-validation.js"></script>

</body>
</html>
